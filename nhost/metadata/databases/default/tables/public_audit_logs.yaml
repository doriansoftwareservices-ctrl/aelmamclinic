table:
  name: audit_logs
  schema: public
insert_permissions:
- role: superadmin
  permission:
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    columns: '*'
select_permissions:
- role: me
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: account_users
          schema: public
        _where:
          account_id:
            _ceq:
            - $
            - account_id
          disabled:
            _eq: false
          role:
            _in:
            - owner
            - admin
          user_uid:
            _eq: X-Hasura-User-Id
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: account_users
          schema: public
        _where:
          account_id:
            _ceq:
            - $
            - account_id
          disabled:
            _eq: false
          role:
            _in:
            - owner
            - admin
          user_uid:
            _eq: X-Hasura-User-Id
update_permissions:
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
delete_permissions:
- role: superadmin
  permission:
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
