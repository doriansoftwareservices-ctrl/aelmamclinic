table:
  name: v_admin_usage_metrics
  schema: public
select_permissions:
  - role: superadmin
    permission:
      columns:
        - accounts
        - account_users
        - chat_messages_30d
        - chat_attachments
        - audit_events_7d
        - active_users_30d
        - server_time
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
