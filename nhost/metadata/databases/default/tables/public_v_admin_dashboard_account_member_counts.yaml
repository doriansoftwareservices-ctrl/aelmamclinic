table:
  name: v_admin_dashboard_account_member_counts
  schema: public
select_permissions:
- role: superadmin
  permission:
    columns:
    - account_id
    - account_name
    - owners_count
    - admins_count
    - employees_count
    - total_members
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
