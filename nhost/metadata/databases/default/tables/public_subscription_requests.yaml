table:
  name: subscription_requests
  schema: public
insert_permissions:
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: user_current_account
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                user_uid:
                  _eq: X-Hasura-User-Id
      columns:
        - account_id
        - user_uid
        - plan_code
        - payment_method_id
        - amount
        - proof_url
        - reference_text
        - sender_name
        - clinic_name
        - status
        - note
select_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns:
        - id
        - account_id
        - user_uid
        - plan_code
        - payment_method_id
        - amount
        - proof_url
        - reference_text
        - sender_name
        - clinic_name
        - status
        - note
        - created_at
        - updated_at
        - reviewed_by
        - reviewed_at
      filter:
        _exists:
          _table:
            name: user_current_account
            schema: public
          _where:
            account_id:
              _ceq: account_id
            user_uid:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
delete_permissions:
  - role: superadmin
    permission:
      filter: {}
