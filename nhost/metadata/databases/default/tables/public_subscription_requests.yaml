table:
  name: subscription_requests
  schema: public
insert_permissions:
  - role: superadmin
    permission:
      check:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: user_current_account
                schema: public
              _where:
                account_id:
                  _ceq:
                    - $
                    - account_id
                user_uid:
                  _eq: X-Hasura-User-Id
      columns:
        - account_id
        - user_uid
        - plan_code
        - payment_method_id
        - amount
        - proof_url
        - reference_text
        - sender_name
        - clinic_name
        - status
        - note
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - account_id
        - user_uid
        - plan_code
        - payment_method_id
        - amount
        - proof_url
        - reference_text
        - sender_name
        - clinic_name
        - status
        - note
        - created_at
        - updated_at
        - reviewed_by
        - reviewed_at
      filter:
        _exists:
          _table:
            name: user_current_account
            schema: public
          _where:
            account_id:
              _ceq:
                - $
                - account_id
            user_uid:
              _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns:
        - id
        - account_id
        - user_uid
        - plan_code
        - payment_method_id
        - amount
        - proof_url
        - reference_text
        - sender_name
        - clinic_name
        - status
        - note
        - created_at
        - updated_at
        - reviewed_by
        - reviewed_at
      filter:
        _exists:
          _table:
            name: user_current_account
            schema: public
          _where:
            account_id:
              _ceq:
                - $
                - account_id
            user_uid:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
      check:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
delete_permissions:
  - role: superadmin
    permission:
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_plan_request
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://nbbywmmebvxegshrvgic.functions.ap-southeast-1.nhost.run/v1/notify-plan-request
    headers:
      - name: x-hasura-event-secret
        value_from_env: NHOST_WEBHOOK_SECRET
