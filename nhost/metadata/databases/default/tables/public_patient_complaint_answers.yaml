            - allowed_features:
                _contains:
                - patients.questions
      - _exists:
          _table:
            name: valid_clinical_parent_links
            schema: public
          _where:
            row_kind:
              _eq: patient_complaint_answers
            id:
              _ceq:
              - $
              - id
            account_id:
              _ceq:
              - $
              - account_id
- role: superadmin
