table:
  name: patient_complaint_answers
  schema: public
object_relationships:
- name: complaint_question
  using:
    foreign_key_constraint_on: question_id
- name: patient_complaint
  using:
    foreign_key_constraint_on: patient_complaint_id
insert_permissions:
- role: me
  permission:
    check:
      _exists:
        _table:
          name: active_account_feature_access
          schema: public
        _where:
          account_id:
            _ceq:
            - $
            - account_id
          user_uid:
            _eq: X-Hasura-User-Id
          _or:
          - allow_all:
              _eq: true
          - allowed_features:
              _contains:
              - patients.questions
          can_create:
            _eq: true
    columns: '*'
- role: superadmin
  permission:
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    columns: '*'
- role: user
  permission:
    check:
      _exists:
        _table:
          name: active_account_feature_access
          schema: public
        _where:
          account_id:
            _ceq:
            - $
            - account_id
          user_uid:
            _eq: X-Hasura-User-Id
          _or:
          - allow_all:
              _eq: true
          - allowed_features:
              _contains:
              - patients.questions
          can_create:
            _eq: true
    columns: '*'
select_permissions:
