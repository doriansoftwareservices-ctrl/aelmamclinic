table:
  name: v_chat_typing_active
  schema: public
select_permissions:
  - role: employee
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            _or:
              - is_deleted:
                  _eq: false
              - is_deleted:
                  _is_null: true
            user_uid:
              _eq: X-Hasura-User-Id
  - role: me
    permission:
