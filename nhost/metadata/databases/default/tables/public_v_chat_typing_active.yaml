table:
  name: v_chat_typing_active
  schema: public
select_permissions:
- role: employee
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: chat_current_access
          schema: public
        _where:
          conversation_id:
            _ceq:
            - $
            - conversation_id
          user_uid:
            _eq: X-Hasura-User-Id
          can_read:
            _eq: true
