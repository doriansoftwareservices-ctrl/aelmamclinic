table:
  name: chat_participants
  schema: public
object_relationships:
  - name: chat_conversation
    using:
      foreign_key_constraint_on: conversation_id
insert_permissions:
  - role: me
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - chat_conversation:
              created_by:
                _eq: X-Hasura-User-Id
          - role:
              _eq: owner
          - _or:
              - _exists:
                  _table:
                    name: chat_current_access
                    schema: public
                  _where:
                    can_bootstrap:
                      _eq: true
                    conversation_id:
                      _ceq:
                        - $
                        - conversation_id
                    user_uid:
                      _eq: X-Hasura-User-Id
              - _exists:
                  _table:
                    name: chat_current_access
                    schema: public
                  _where:
                    can_self_update:
                      _eq: true
                    conversation_id:
                      _ceq:
                        - $
                        - conversation_id
                    user_uid:
                      _eq: X-Hasura-User-Id
      columns:
        - account_id
        - conversation_id
        - user_uid
        - email
        - nickname
        - role
        - joined_at
        - muted
  - role: superadmin
    permission:
      check:
        _exists:
          _table:
            name: chat_current_access
            schema: public
          _where:
            can_read:
              _eq: true
            conversation_id:
              _ceq:
                - $
                - conversation_id
            is_superadmin:
              _eq: true
            user_uid:
              _eq: X-Hasura-User-Id
      columns:
        - account_id
        - conversation_id
        - user_uid
        - email
        - nickname
        - role
        - joined_at
        - muted
  - role: support
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
