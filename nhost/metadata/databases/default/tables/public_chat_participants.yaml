table:
  name: chat_participants
  schema: public
object_relationships:
  - name: chat_conversation
    using:
      foreign_key_constraint_on: conversation_id
insert_permissions:
  - role: me
    permission:
      check:
        _and:
          - _or:
              - _and:
                  - account_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        disabled:
                          _eq: false
                        role:
                          _in:
                            - owner
                            - admin
                        user_uid:
                          _eq: X-Hasura-User-Id
              - _and:
                  - account_id:
                      _is_null: false
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        account_id:
                          _ceq: account_id
                        disabled:
                          _eq: false
                        user_uid:
                          _eq: X-Hasura-User-Id
          - _or:
              - user_uid:
                  _eq: X-Hasura-User-Id
              - chat_conversation:
                  created_by:
                    _eq: X-Hasura-User-Id
      columns:
        - account_id
        - conversation_id
        - user_uid
        - email
        - nickname
        - role
        - joined_at
        - muted
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: support
    permission:
      check:
        _and:
          - _or:
              - _and:
                  - account_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        disabled:
                          _eq: false
                        role:
                          _in:
                            - owner
                            - admin
                        user_uid:
                          _eq: X-Hasura-User-Id
              - _and:
                  - account_id:
                      _is_null: false
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        account_id:
                          _ceq: account_id
                        disabled:
                          _eq: false
                        user_uid:
                          _eq: X-Hasura-User-Id
          - _or:
              - user_uid:
                  _eq: X-Hasura-User-Id
              - chat_conversation:
                  created_by:
                    _eq: X-Hasura-User-Id
      columns:
        - account_id
        - conversation_id
        - user_uid
        - email
        - nickname
        - role
        - joined_at
        - muted
  - role: user
    permission:
      check:
        _and:
          - _or:
              - _and:
                  - account_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        disabled:
                          _eq: false
                        role:
                          _in:
                            - owner
                            - admin
                        user_uid:
                          _eq: X-Hasura-User-Id
              - _and:
                  - account_id:
                      _is_null: false
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        account_id:
                          _ceq: account_id
                        disabled:
                          _eq: false
                        user_uid:
                          _eq: X-Hasura-User-Id
          - _or:
              - user_uid:
                  _eq: X-Hasura-User-Id
              - chat_conversation:
                  created_by:
                    _eq: X-Hasura-User-Id
      columns:
        - account_id
        - conversation_id
        - user_uid
        - email
        - nickname
        - role
        - joined_at
        - muted
