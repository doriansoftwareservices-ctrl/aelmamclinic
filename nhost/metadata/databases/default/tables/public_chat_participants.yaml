                        - $
                        - conversation_id
                    user_uid:
                      _eq: X-Hasura-User-Id
              - _exists:
                  _table:
                    name: chat_current_access
                    schema: public
                  _where:
                    can_self_update:
                      _eq: true
                    conversation_id:
                      _ceq:
                        - $
                        - conversation_id
                    user_uid:
                      _eq: X-Hasura-User-Id
      columns:
        - account_id
        - conversation_id
        - user_uid
        - email
        - nickname
        - role
        - joined_at
        - muted
  - role: user
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
