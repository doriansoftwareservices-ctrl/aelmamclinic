table:
  name: v_chat_reads_for_me
  schema: public
select_permissions:
  - role: employee
    permission:
      columns: '*'
      filter:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: chat_current_access
                schema: public
              _where:
                can_read:
                  _eq: true
                conversation_id:
                  _ceq:
                    - $
                    - conversation_id
                user_uid:
                  _eq: X-Hasura-User-Id
  - role: me
