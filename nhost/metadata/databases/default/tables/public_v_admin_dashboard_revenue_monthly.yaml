table:
  name: v_admin_dashboard_revenue_monthly
  schema: public
select_permissions:
  - role: superadmin
    permission:
      columns:
        - month
        - payments_count
        - total_amount_usd
        - avg_payment_usd
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
