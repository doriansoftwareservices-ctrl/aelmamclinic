table:
  name: v_chat_conversations_for_me
  schema: public
select_permissions:
- role: employee
  permission:
    columns: '*'
    filter: {}
- role: me
  permission:
    columns: '*'
    filter: {}
- role: owner
  permission:
    columns: '*'
    filter: {}
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: support
  permission:
    columns: '*'
    filter: {}
- role: user
  permission:
    columns: '*'
    filter: {}
