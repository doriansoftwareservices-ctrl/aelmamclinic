table:
  name: account_subscriptions
  schema: public
insert_permissions:
- role: superadmin
  permission:
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    columns: '*'
select_permissions:
- role: owner
  permission:
    columns:
    - id
    - account_id
    - plan_code
    - status
    - start_at
    - end_at
    - created_at
    - updated_at
    - approved_at
    - request_id
    filter:
      _exists:
        _table:
          name: user_current_account
          schema: public
        _where:
          account_id:
            _ceq:
            - $
            - account_id
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns:
    - id
    - account_id
    - plan_code
    - status
    - start_at
    - end_at
    - created_at
    - updated_at
    - approved_at
    - request_id
    filter:
      _exists:
        _table:
          name: user_current_account
          schema: public
        _where:
          account_id:
            _ceq:
            - $
            - account_id
          user_uid:
            _eq: X-Hasura-User-Id
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
update_permissions:
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
delete_permissions:
- role: superadmin
  permission:
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
