table:
  name: v_my_account_plan
  schema: public
select_permissions:
- role: employee
  permission:
    columns:
    - plan_code
    - plan_end_at
    filter: {}
- role: me
  permission:
    columns:
    - plan_code
    - plan_end_at
    filter: {}
- role: owner
  permission:
    columns:
    - plan_code
    - plan_end_at
    filter: {}
- role: superadmin
  permission:
    columns:
    - plan_code
    - plan_end_at
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns:
    - plan_code
    - plan_end_at
    filter: {}
