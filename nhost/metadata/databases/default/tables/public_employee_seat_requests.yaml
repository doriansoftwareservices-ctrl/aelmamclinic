table:
  name: employee_seat_requests
  schema: public
insert_permissions:
- role: superadmin
  permission:
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    columns: '*'
select_permissions:
- role: me
  permission:
    columns: '*'
    filter:
      _or:
      - requested_by_uid:
          _eq: X-Hasura-User-Id
      - employee_user_uid:
          _eq: X-Hasura-User-Id
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns: '*'
    filter:
      _or:
      - requested_by_uid:
          _eq: X-Hasura-User-Id
      - employee_user_uid:
          _eq: X-Hasura-User-Id
update_permissions:
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
delete_permissions:
- role: superadmin
  permission:
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
event_triggers:
- name: notify_employee_seat_request
  definition:
    enable_manual: false
    insert:
      columns: '*'
    update:
      columns:
      - status
      - receipt_file_id
      - payment_method_id
  retry_conf:
    interval_sec: 10
    num_retries: 3
    timeout_sec: 60
  webhook: https://nbbywmmebvxegshrvgic.functions.ap-southeast-1.nhost.run/v1/notify-plan-request
  headers:
  - name: x-hasura-event-secret
    value_from_env: NHOST_WEBHOOK_SECRET
