table:
  name: v_my_account_id
  schema: public
select_permissions:
- role: me
  permission:
    columns:
    - account_id
    filter: {}
- role: superadmin
  permission:
    columns:
    - account_id
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns:
    - account_id
    filter: {}
