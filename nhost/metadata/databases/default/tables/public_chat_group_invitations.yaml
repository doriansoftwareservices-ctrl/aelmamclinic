table:
  name: chat_group_invitations
  schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
        inviter_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
        inviter_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _or:
          - inviter_uid:
              _eq: X-Hasura-User-Id
          - invitee_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: chat_participants
                schema: public
              _where:
                conversation_id:
                  _ceq: conversation_id
                user_uid:
                  _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns: '*'
      filter:
        _or:
          - inviter_uid:
              _eq: X-Hasura-User-Id
          - invitee_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: chat_participants
                schema: public
              _where:
                conversation_id:
                  _ceq: conversation_id
                user_uid:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _or:
          - inviter_uid:
              _eq: X-Hasura-User-Id
          - invitee_uid:
              _eq: X-Hasura-User-Id
      check:
        _or:
          - inviter_uid:
              _eq: X-Hasura-User-Id
          - invitee_uid:
              _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
  - role: user
    permission:
      columns: '*'
      filter:
        _or:
          - inviter_uid:
              _eq: X-Hasura-User-Id
          - invitee_uid:
              _eq: X-Hasura-User-Id
      check:
        _or:
          - inviter_uid:
              _eq: X-Hasura-User-Id
          - invitee_uid:
              _eq: X-Hasura-User-Id
delete_permissions:
  - role: me
    permission:
      filter:
        inviter_uid:
          _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      filter: {}
  - role: user
    permission:
      filter:
        inviter_uid:
          _eq: X-Hasura-User-Id
