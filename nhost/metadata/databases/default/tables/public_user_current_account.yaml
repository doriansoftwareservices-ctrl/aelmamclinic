table:
  name: user_current_account
  schema: public
insert_permissions:
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _eq: account_id
                disabled:
                  _eq: false
                user_uid:
                  _eq: X-Hasura-User-Id
      columns:
        - user_uid
        - account_id
select_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns:
        - user_uid
        - account_id
        - created_at
        - updated_at
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
  - role: user
    permission:
      columns:
        - account_id
      filter:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _eq: account_id
                disabled:
                  _eq: false
                user_uid:
                  _eq: X-Hasura-User-Id
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _eq: account_id
                disabled:
                  _eq: false
                user_uid:
                  _eq: X-Hasura-User-Id
delete_permissions:
  - role: superadmin
    permission:
      filter: {}
  - role: user
    permission:
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
