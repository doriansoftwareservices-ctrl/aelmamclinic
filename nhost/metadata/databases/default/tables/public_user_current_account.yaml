table:
  name: user_current_account
  schema: public
insert_permissions:
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        user_uid:
          _eq: X-Hasura-User-Id
      columns:
        - user_uid
        - account_id
select_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns:
        - user_uid
        - account_id
        - created_at
        - updated_at
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
  - role: user
    permission:
      columns:
        - account_id
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
      check:
        user_uid:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: superadmin
    permission:
      filter: {}
  - role: user
    permission:
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
