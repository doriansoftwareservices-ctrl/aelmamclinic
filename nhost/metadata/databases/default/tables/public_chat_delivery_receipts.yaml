table:
  name: chat_delivery_receipts
  schema: public
insert_permissions:
- role: employee
  permission:
    check:
      _and:
      - _exists:
          _table:
            name: chat_current_access
            schema: public
          _where:
            conversation_id:
              _ceq:
              - $
              - conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
            can_read:
              _eq: true
      - user_uid:
          _eq: X-Hasura-User-Id
    columns: &id001
    - message_id
    - conversation_id
    - user_uid
    - delivered_at
