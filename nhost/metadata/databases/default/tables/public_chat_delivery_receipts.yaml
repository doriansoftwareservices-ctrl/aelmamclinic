table:
  name: chat_delivery_receipts
  schema: public
insert_permissions:
  - role: employee
    permission:
      check:
        _and:
          - user_uid:
              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: chat_participants
                schema: public
              _where:
                _or:
                  - is_deleted:
                      _eq: false
                  - is_deleted:
                      _is_null: true
                conversation_id:
                  _ceq: conversation_id
                user_uid:
                  _eq: X-Hasura-User-Id
