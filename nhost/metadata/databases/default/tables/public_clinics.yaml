table:
  name: clinics
  schema: public
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter: {}
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: '*'
      filter: {}
