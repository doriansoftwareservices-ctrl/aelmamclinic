table:
  name: files
  schema: storage
configuration:
  column_config:
    bucket_id:
      custom_name: bucketId
    created_at:
      custom_name: createdAt
    etag:
      custom_name: etag
    id:
      custom_name: id
    is_uploaded:
      custom_name: isUploaded
    metadata:
      custom_name: metadata
    mime_type:
      custom_name: mimeType
    name:
      custom_name: name
    size:
      custom_name: size
    updated_at:
      custom_name: updatedAt
    uploaded_by_user_id:
      custom_name: uploadedByUserId
  custom_name: files
  custom_root_fields:
    delete: deleteFiles
    delete_by_pk: deleteFile
    insert: insertFiles
    insert_one: insertFile
    select: files
    select_aggregate: filesAggregate
    select_by_pk: file
    update: updateFiles
    update_by_pk: updateFile
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id

# Chat buckets are intentionally absent from every client permission below.
# Upload, resolve, sign, and delete operations go through the audited Functions
# which derive account/conversation ownership on the server.
insert_permissions:
  - role: employee
    permission: &proof_insert
      check:
        _and:
          - bucket_id:
              _eq: subscription-proofs
          - _exists:
              _table: {schema: public, name: account_users}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}
      set:
        uploaded_by_user_id: x-hasura-user-id
      columns: '*'
  - role: me
    permission: *proof_insert
  - role: owner
    permission: *proof_insert
  - role: user
    permission: *proof_insert
  - role: superadmin
    permission:
      check:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - _exists:
              _table: {schema: public, name: super_admins}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}
      set:
        uploaded_by_user_id: x-hasura-user-id
      columns: '*'

select_permissions:
  - role: employee
    permission: &proof_select_own
      columns: '*'
      filter:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - uploaded_by_user_id: {_eq: X-Hasura-User-Id}
          - _exists:
              _table: {schema: public, name: account_users}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}
  - role: me
    permission: *proof_select_own
  - role: owner
    permission: *proof_select_own
  - role: user
    permission: *proof_select_own
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - _exists:
              _table: {schema: public, name: super_admins}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}

update_permissions:
  - role: owner
    permission: &proof_update_owner
      columns: '*'
      filter:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - uploaded_by_user_id: {_eq: X-Hasura-User-Id}
          - _exists:
              _table: {schema: public, name: account_users}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}
                role: {_in: [owner, admin]}
      check:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - uploaded_by_user_id: {_eq: X-Hasura-User-Id}
  - role: employee
    permission: *proof_update_owner
  - role: me
    permission: *proof_update_owner
  - role: user
    permission: *proof_update_owner
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - _exists:
              _table: {schema: public, name: super_admins}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}
      check:
        bucket_id: {_eq: subscription-proofs}

delete_permissions:
  - role: owner
    permission: &proof_delete_owner
      filter:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - uploaded_by_user_id: {_eq: X-Hasura-User-Id}
          - _exists:
              _table: {schema: public, name: account_users}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}
                role: {_in: [owner, admin]}
  - role: employee
    permission: *proof_delete_owner
  - role: me
    permission: *proof_delete_owner
  - role: user
    permission: *proof_delete_owner
  - role: superadmin
    permission:
      filter:
        _and:
          - bucket_id: {_eq: subscription-proofs}
          - _exists:
              _table: {schema: public, name: super_admins}
              _where:
                user_uid: {_eq: X-Hasura-User-Id}
                disabled: {_eq: false}