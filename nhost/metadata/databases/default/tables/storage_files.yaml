  custom_column_names:
    bucket_id: bucketId
    conversation_id: conversationId
    created_at: createdAt
    etag: etag
    id: id
    is_uploaded: isUploaded
    message_id: messageId
    metadata: metadata
    mime_type: mimeType
    name: name
    size: size
    updated_at: updatedAt
    uploaded_by_user_id: uploadedByUserId
  custom_name: files
  custom_root_fields:
    delete: deleteFiles
    delete_by_pk: deleteFile
    insert: insertFiles
    insert_one: insertFile
    select: files
    select_aggregate: filesAggregate
    select_by_pk: file
    update: updateFiles
    update_by_pk: updateFile
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id
insert_permissions:
  - role: employee
    permission:
      check:
        _and:
          - bucket_id:
              _in:
                - subscription-proofs
                - chat-images
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                disabled:
                  _eq: false
                role:
                  _in:
                    - owner
                    - admin
                user_uid:
                  _eq: X-Hasura-User-Id
      set:
        uploaded_by_user_id: x-hasura-user-id
      columns: '*'
  - role: me
    permission:
      check:
        _and:
          - bucket_id:
              _in:
                - subscription-proofs
                - chat-images
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                disabled:
                  _eq: false
                role:
                  _in:
                    - owner
                    - admin
                user_uid:
                  _eq: X-Hasura-User-Id
      set:
        uploaded_by_user_id: x-hasura-user-id
      columns: '*'
  - role: owner
    permission:
      check:
        _and:
          - bucket_id:
              _in:
                - subscription-proofs
                - chat-images
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                disabled:
                  _eq: false
                role:
                  _in:
                    - owner
                    - admin
                user_uid:
                  _eq: X-Hasura-User-Id
      set:
        uploaded_by_user_id: x-hasura-user-id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - bucket_id:
              _in:
                - subscription-proofs
                - chat-images
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                disabled:
                  _eq: false
                role:
                  _in:
                    - owner
                    - admin
                user_uid:
                  _eq: X-Hasura-User-Id
      set:
        uploaded_by_user_id: x-hasura-user-id
      columns: '*'
select_permissions:
  - role: employee
    permission:
      columns: '*'
      filter:
        _or:
          - _and:
              - bucket_id:
                  _eq: subscription-proofs
              - _or:
                  - uploaded_by_user_id:
                      _eq: X-Hasura-User-Id
                  - _exists:
                      _table:
                        name: super_admins
                        schema: public
