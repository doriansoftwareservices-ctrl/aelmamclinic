table:
  name: files
  schema: storage
configuration:
  column_config:
    bucket_id:
      custom_name: bucketId
    created_at:
      custom_name: createdAt
    conversation_id:
      custom_name: conversationId
    etag:
      custom_name: etag
    id:
      custom_name: id
    is_uploaded:
      custom_name: isUploaded
    metadata:
      custom_name: metadata
    message_id:
      custom_name: messageId
    mime_type:
      custom_name: mimeType
    name:
      custom_name: name
    size:
      custom_name: size
    updated_at:
      custom_name: updatedAt
    uploaded_by_user_id:
      custom_name: uploadedByUserId
  custom_column_names:
    bucket_id: bucketId
    created_at: createdAt
    conversation_id: conversationId
    etag: etag
    id: id
    is_uploaded: isUploaded
    metadata: metadata
    message_id: messageId
    mime_type: mimeType
    name: name
    size: size
    updated_at: updatedAt
    uploaded_by_user_id: uploadedByUserId
  custom_name: files
  custom_root_fields:
    delete: deleteFiles
    delete_by_pk: deleteFile
    insert: insertFiles
    insert_one: insertFile
    select: files
    select_aggregate: filesAggregate
    select_by_pk: file
    update: updateFiles
    update_by_pk: updateFile
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id
  - name: chat_conversation
    using:
      manual_configuration:
        column_mapping:
          conversation_id: id
        insertion_order: null
        remote_table:
          name: chat_conversations
          schema: public
select_permissions:
  - role: me
    permission:
      columns: "*"
      filter:
        _or:
          - _and:
              - bucket_id:
                  _eq: chat-attachments
              - _or:
                  - uploaded_by_user_id:
                      _eq: "X-Hasura-User-Id"
                  - chat_conversation:
                      chat_participants:
                        user_uid:
                          _eq: "X-Hasura-User-Id"
          - _and:
              - bucket_id:
                  _eq: subscription-proofs
              - uploaded_by_user_id:
                  _eq: "X-Hasura-User-Id"
              - _exists:
                  _table:
                    name: account_users
                    schema: public
                  _where:
                    user_uid:
                      _eq: "X-Hasura-User-Id"
                    disabled:
                      _eq: false
                    role:
                      _in:
                        - owner
                        - admin
  - role: user
    permission:
      columns: "*"
      filter:
