table:
  name: chat_conversations
  schema: public
array_relationships:
  - name: chat_participants
    using:
      foreign_key_constraint_on:
        column: conversation_id
        table:
          name: chat_participants
          schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _and:
          - created_by:
              _eq: X-Hasura-User-Id
          - _or:
              - _and:
                  - account_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        disabled:
                          _eq: false
                        user_uid:
                          _eq: X-Hasura-User-Id
          - _and:
              - account_id:
                  _is_null: false
              - _exists:
                  _table:
                    name: account_users
                    schema: public
                  _where:
                    account_id:
                      _ceq: account_id
                    disabled:
                      _eq: false
                    user_uid:
                      _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - created_by:
              _eq: X-Hasura-User-Id
          - _or:
              - _and:
                  - account_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        disabled:
                          _eq: false
                        role:
                          _in:
                            - owner
                            - admin
                        user_uid:
                          _eq: X-Hasura-User-Id
              - _and:
                  - account_id:
                      _is_null: false
                  - _exists:
                      _table:
                        name: account_users
                        schema: public
                      _where:
                        account_id:
                          _ceq: account_id
                        disabled:
                          _eq: false
                        user_uid:
                          _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: employee
    permission:
      columns: '*'
      filter:
        chat_participants:
          _and:
            - user_uid:
                _eq: X-Hasura-User-Id
            - _or:
                - is_deleted:
                    _eq: false
                - is_deleted:
                    _is_null: true
  - role: me
    permission:
      columns: '*'
      filter:
        chat_participants:
          _and:
            - user_uid:
                _eq: X-Hasura-User-Id
            - _or:
                - is_deleted:
                    _eq: false
                - is_deleted:
                    _is_null: true
  - role: owner
    permission:
      columns: '*'
      filter:
        chat_participants:
          _and:
            - user_uid:
                _eq: X-Hasura-User-Id
            - _or:
                - is_deleted:
                    _eq: false
                - is_deleted:
                    _is_null: true
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns: '*'
      filter:
        chat_participants:
          _and:
            - user_uid:
                _eq: X-Hasura-User-Id
            - _or:
                - is_deleted:
                    _eq: false
                - is_deleted:
                    _is_null: true
update_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        created_by:
          _eq: X-Hasura-User-Id
      check:
        created_by:
          _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
  - role: user
    permission:
      columns: '*'
      filter:
        created_by:
          _eq: X-Hasura-User-Id
      check:
        created_by:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: me
    permission:
      filter:
        created_by:
          _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      filter: {}
  - role: user
    permission:
      filter:
        created_by:
          _eq: X-Hasura-User-Id
