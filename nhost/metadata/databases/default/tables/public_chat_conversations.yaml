table:
  name: chat_conversations
  schema: public
array_relationships:
  - name: chat_participants
    using:
      foreign_key_constraint_on:
        column: conversation_id
        table:
          name: chat_participants
          schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _and:
          - _and:
              - created_by:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - account_id:
                          _is_null: true
                      - _exists:
                          _table:
                            name: account_users
                            schema: public
                          _where:
                            disabled:
                              _eq: false
                            role:
                              _in:
                                - owner
                                - admin
                            user_uid:
                              _eq: X-Hasura-User-Id
                  - _and:
                      - account_id:
                          _is_null: false
                      - _exists:
                          _table:
                            name: account_users
                            schema: public
                          _where:
                            account_id:
                              _ceq:
                                - $
                                - account_id
                            disabled:
                              _eq: false
                            user_uid:
                              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: active_authenticated_identity
                schema: public
              _where:
                user_uid:
                  _eq: X-Hasura-User-Id
          - _or:
              - account_id:
                  _is_null: true
              - _exists:
                  _table:
                    name: accounts
                    schema: public
                  _where:
                    frozen:
                      _neq: true
                    id:
                      _ceq:
                        - $
                        - account_id
          - is_deleted:
              _eq: false
      columns:
        - id
        - account_id
        - is_group
        - title
        - is_frozen
        - admins_only
        - created_by
        - created_at
        - updated_at
  - role: superadmin
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: active_superadmin_identity
                schema: public
              _where:
                user_uid:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: active_authenticated_identity
                schema: public
              _where:
                user_uid:
                  _eq: X-Hasura-User-Id
          - _or:
              - account_id:
                  _is_null: true
              - _exists:
                  _table:
                    name: accounts
                    schema: public
                  _where:
                    frozen:
                      _neq: true
                    id:
                      _ceq:
                        - $
                        - account_id
          - is_deleted:
              _eq: false
      columns:
        - id
        - account_id
        - is_group
        - title
        - is_frozen
        - admins_only
        - created_by
        - created_at
        - updated_at
  - role: user
    permission:
      check:
        _and:
          - _and:
              - created_by:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - account_id:
                          _is_null: true
                      - _exists:
                          _table:
                            name: account_users
                            schema: public
                          _where:
                            disabled:
                              _eq: false
                            role:
                              _in:
                                - owner
                                - admin
                            user_uid:
                              _eq: X-Hasura-User-Id
                  - _and:
                      - account_id:
                          _is_null: false
                      - _exists:
                          _table:
                            name: account_users
                            schema: public
                          _where:
                            account_id:
                              _ceq:
                                - $
                                - account_id
                            disabled:
                              _eq: false
                            user_uid:
                              _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: active_authenticated_identity
                schema: public
              _where:
                user_uid:
                  _eq: X-Hasura-User-Id
          - _or:
              - account_id:
                  _is_null: true
              - _exists:
                  _table:
                    name: accounts
                    schema: public
                  _where:
                    frozen:
                      _neq: true
                    id:
                      _ceq:
                        - $
                        - account_id
          - is_deleted:
              _eq: false
      columns:
        - id
        - account_id
        - is_group
        - title
        - is_frozen
        - admins_only
        - created_by
        - created_at
        - updated_at
