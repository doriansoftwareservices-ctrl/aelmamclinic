- role: employee
  permission:
    check:
      _and:
      - _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            _or:
            - is_deleted:
                _eq: false
            - is_deleted:
                _is_null: true
            conversation_id:
              _ceq:
