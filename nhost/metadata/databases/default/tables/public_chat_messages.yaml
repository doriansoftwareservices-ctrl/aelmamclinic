event_triggers:
- name: notify_chat_message
  definition:
    enable_manual: false
    insert:
      columns: '*'
  retry_conf:
    interval_sec: 10
    num_retries: 3
    timeout_sec: 60
  webhook: https://nbbywmmebvxegshrvgic.functions.ap-southeast-1.nhost.run/v1/notify-chat-message
  headers:
  - name: x-hasura-event-secret
    value_from_env: NHOST_WEBHOOK_SECRET
