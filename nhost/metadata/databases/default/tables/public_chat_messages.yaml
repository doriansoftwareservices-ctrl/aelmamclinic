table:
  name: chat_messages
  schema: public
array_relationships:
  - name: chat_attachments
    using:
      manual_configuration:
        column_mapping:
          id: message_id
        insertion_order: null
        remote_table:
          name: chat_attachments
          schema: public
  - name: chat_delivery_receipts
    using:
      foreign_key_constraint_on:
        column: message_id
        table:
          name: chat_delivery_receipts
          schema: public
  - name: chat_participants
    using:
      manual_configuration:
        column_mapping:
          conversation_id: conversation_id
        insertion_order: null
        remote_table:
          name: chat_participants
          schema: public
insert_permissions:
  - role: employee
    permission:
      check:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
        sender_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
        sender_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
  - role: owner
    permission:
      check:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
        sender_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
        sender_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: employee
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
  - role: me
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
  - role: owner
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
            conversation_id:
              _ceq: conversation_id
            user_uid:
              _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: chat_participants
            schema: public
          _where:
