table:
  name: medical_services
  schema: public
array_relationships:
  - name: active_feature_access
    using:
      manual_configuration:
        column_mapping:
          account_id: account_id
        insertion_order: null
        remote_table:
          name: active_account_feature_access
          schema: public
  - name: active_superadmin_access
    using:
      manual_configuration:
        column_mapping:
          account_id: account_id
        insertion_order: null
        remote_table:
          name: active_superadmin_account_access
          schema: public
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _or:
          - _and:
              - active_feature_access:
                  _or:
                    - allow_all:
                        _eq: true
                    - allowed_features:
                        _contains:
                          - lab_radiology
                  user_uid:
                    _eq: X-Hasura-User-Id
          - _and:
              - service_type:
                  _in:
                    - doctorGeneral
                    - doctor
                    - طبيب
              - active_feature_access:
                  _or:
                    - allowed_features:
                        _contains:
                          - employees
                    - allowed_features:
                        _contains:
                          - patients.new
                    - allowed_features:
                        _contains:
                          - patients.list
                  user_uid:
                    _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _and:
          - active_superadmin_access:
              user_uid:
                _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: active_superadmin_identity
                schema: public
              _where:
                user_uid:
                  _eq: X-Hasura-User-Id
  - role: user
    permission:
      columns: '*'
      filter:
        _or:
          - _and:
              - active_feature_access:
                  _or:
                    - allow_all:
                        _eq: true
                    - allowed_features:
                        _contains:
                          - lab_radiology
                  user_uid:
                    _eq: X-Hasura-User-Id
          - _and:
              - service_type:
                  _in:
                    - doctorGeneral
                    - doctor
                    - طبيب
              - active_feature_access:
                  _or:
                    - allowed_features:
                        _contains:
                          - employees
                    - allowed_features:
                        _contains:
                          - patients.new
                    - allowed_features:
                        _contains:
                          - patients.list
                  user_uid:
                    _eq: X-Hasura-User-Id
