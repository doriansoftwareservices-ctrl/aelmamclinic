table:
  name: chat_typing
  schema: public
insert_permissions:
  - role: employee
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: chat_current_access
                schema: public
              _where:
                can_read:
                  _eq: true
                conversation_id:
                  _ceq:
                    - $
                    - conversation_id
                user_uid:
                  _eq: X-Hasura-User-Id
          - user_uid:
              _eq: X-Hasura-User-Id
      columns:
        - conversation_id
        - user_uid
        - email
        - typing
        - updated_at
