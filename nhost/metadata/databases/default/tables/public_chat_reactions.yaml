table:
  name: chat_reactions
  schema: public
insert_permissions:
  - role: employee
    permission:
      check:
        _and:
          - account_id:
              _is_null: false
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                disabled:
                  _eq: false
                user_uid:
                  _eq: X-Hasura-User-Id
          - user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
