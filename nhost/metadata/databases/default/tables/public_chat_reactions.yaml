table:
  name: chat_reactions
  schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
        user_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                disabled:
                  _eq: false
                user_uid:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: employees
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                is_doctor:
                  _eq: true
                user_uid:
                  _eq: X-Hasura-User-Id
        user_uid:
          _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: employees
            schema: public
          _where:
            account_id:
              _ceq: account_id
            is_doctor:
              _eq: true
            user_uid:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
      check:
        user_uid:
          _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
  - role: user
    permission:
      columns: '*'
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
      check:
        user_uid:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: me
    permission:
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      filter: {}
  - role: user
    permission:
      filter:
        user_uid:
          _eq: X-Hasura-User-Id
