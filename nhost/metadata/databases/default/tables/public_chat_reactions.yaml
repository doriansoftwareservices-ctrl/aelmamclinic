insert_permissions:
- role: employee
  permission:
    check:
      _and:
      - _and:
        - account_id:
            _is_null: false
        - _exists:
            _table:
              name: account_users
              schema: public
            _where:
              account_id:
                _ceq:
                - $
                - account_id
              disabled:
                _eq: false
              user_uid:
                _eq: X-Hasura-User-Id
        - user_uid:
            _eq: X-Hasura-User-Id
        - _exists:
            _table:
              name: active_authenticated_identity
              schema: public
            _where:
              user_uid:
                _eq: X-Hasura-User-Id
        - _exists:
            _table:
              name: chat_messages
              schema: public
            _where:
              id:
                _ceq:
                - $
                - message_id
              chat_participants:
                user_uid:
                  _eq: X-Hasura-User-Id
                _or:
                - is_deleted:
                    _eq: false
                - is_deleted:
                    _is_null: true
      - _exists:
          _table:
            name: chat_message_current_access
            schema: public
          _where:
            message_id:
              _ceq:
              - $
              - message_id
            user_uid:
              _eq: X-Hasura-User-Id
            can_read:
              _eq: true
    columns: '*'
