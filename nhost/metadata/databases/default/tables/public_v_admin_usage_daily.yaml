table:
  name: v_admin_usage_daily
  schema: public
select_permissions:
  - role: superadmin
    permission:
      columns:
        - day
        - messages
        - attachments
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
