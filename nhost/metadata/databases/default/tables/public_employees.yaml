table:
  name: employees
  schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                disabled:
                  _eq: false
                role:
                  _in:
                    - owner
                    - admin
                user_uid:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: employees
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                is_doctor:
                  _eq: true
                user_uid:
                  _eq: X-Hasura-User-Id
      columns: '*'
