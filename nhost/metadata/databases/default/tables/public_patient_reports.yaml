table:
  name: patient_reports
  schema: public
object_relationships:
  - name: patient
    using:
      foreign_key_constraint_on: patient_id
  - name: patient_complaint
    using:
      foreign_key_constraint_on: patient_complaint_id
insert_permissions:
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: active_account_feature_access
            schema: public
          _where:
            _or:
              - allow_all:
                  _eq: true
              - allowed_features:
                  _contains:
                    - patients.questions
            account_id:
              _ceq:
                - $
                - account_id
            can_create:
              _eq: true
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: active_account_feature_access
            schema: public
          _where:
            _or:
              - allow_all:
                  _eq: true
              - allowed_features:
                  _contains:
                    - patients.questions
            account_id:
              _ceq:
                - $
                - account_id
            can_create:
              _eq: true
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _and:
          - _exists:
              _table:
                name: active_account_feature_access
                schema: public
              _where:
                _or:
                  - allow_all:
                      _eq: true
                  - allowed_features:
                      _contains:
                        - patients.questions
                account_id:
                  _ceq:
                    - $
                    - account_id
                user_uid:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: valid_clinical_parent_links
                schema: public
              _where:
                account_id:
                  _ceq:
                    - $
                    - account_id
                id:
                  _ceq:
                    - $
                    - id
                row_kind:
                  _eq: patient_reports
  - role: superadmin
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
