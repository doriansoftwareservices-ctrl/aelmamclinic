table:
  name: accounts
  schema: public
insert_permissions:
  - role: superadmin
    permission:
      check: {}
      columns: '*'
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
  - role: user
    permission:
      columns: '*'
      filter:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: superadmin
    permission:
      columns: '*'
      filter: {}
      check: {}
delete_permissions:
  - role: superadmin
    permission:
      filter: {}
