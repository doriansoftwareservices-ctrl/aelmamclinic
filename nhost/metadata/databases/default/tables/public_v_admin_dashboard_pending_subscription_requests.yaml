table:
  name: v_admin_dashboard_pending_subscription_requests
  schema: public
select_permissions:
  - role: superadmin
    permission:
      columns:
        - request_id
        - created_at
        - age_hours
        - status
        - account_id
        - account_name
        - requester_uid
        - requester_email
        - plan_code
        - plan_name
        - amount_usd
        - payment_method
        - proof_url
        - note
      filter:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
