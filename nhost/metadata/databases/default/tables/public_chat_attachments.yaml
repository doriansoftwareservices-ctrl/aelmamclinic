table:
  name: chat_attachments
  schema: public
object_relationships:
  - name: chat_message
    using:
      foreign_key_constraint_on: message_id
insert_permissions:
  - role: me
    permission:
      check:
        chat_message:
          _and:
            - _exists:
                _table:
                  name: account_users
                  schema: public
                _where:
                  account_id:
                    _ceq: account_id
                  disabled:
                    _eq: false
                  user_uid:
                    _eq: X-Hasura-User-Id
            - _exists:
                _table:
                  name: chat_participants
                  schema: public
                _where:
                  conversation_id:
                    _ceq: conversation_id
                  user_uid:
                    _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
