table:
  name: complaint_templates
  schema: public
array_relationships:
  - name: questions
    using:
      foreign_key_constraint_on:
        column: complaint_id
        table:
          name: complaint_questions
          schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq: account_id
            disabled:
              _eq: false
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
