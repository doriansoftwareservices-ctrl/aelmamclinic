table:
  name: complaint_templates
  schema: public
array_relationships:
  - name: questions
    using:
      foreign_key_constraint_on:
        column: complaint_id
        table:
          name: complaint_questions
          schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _exists:
          _table:
            name: active_account_feature_access
            schema: public
          _where:
            _or:
              - allow_all:
                  _eq: true
              - allowed_features:
                  _contains:
                    - patients.questions
            account_id:
              _ceq:
                - $
                - account_id
            can_create:
              _eq: true
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
  - role: superadmin
    permission:
      check:
        _exists:
          _table:
            name: active_superadmin_identity
            schema: public
          _where:
            user_uid:
              _eq: X-Hasura-User-Id
      columns: '*'
