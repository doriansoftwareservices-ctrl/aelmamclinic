table:
  name: subscription_plans
  schema: public
insert_permissions:
- role: superadmin
  permission:
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    columns: '*'
select_permissions:
- role: me
  permission:
    columns: '*'
    filter:
      is_active:
        _eq: true
- role: superadmin
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns: '*'
    filter:
      is_active:
        _eq: true
