table:
  name: complaints
  schema: public
array_relationships:
- name: active_feature_access
  using:
    manual_configuration:
      column_mapping:
        account_id: account_id
      insertion_order: null
      remote_table:
        name: active_account_feature_access
        schema: public
- name: active_superadmin_access
  using:
    manual_configuration:
      column_mapping:
        account_id: account_id
      insertion_order: null
      remote_table:
        name: active_superadmin_account_access
        schema: public
select_permissions:
- role: me
  permission: &domain_member_select
    columns: '*'
    filter:
      _and:
      - active_feature_access:
          user_uid:
            _eq: X-Hasura-User-Id
          _or:
          - allow_all:
              _eq: true
          - allowed_features:
              _contains:
              - patients.questions
- role: user
  permission: *domain_member_select
- role: superadmin
  permission:
    columns: '*'
    filter:
      active_superadmin_access:
        user_uid:
          _eq: X-Hasura-User-Id
