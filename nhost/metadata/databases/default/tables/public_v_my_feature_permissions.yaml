table:
  name: v_my_feature_permissions
  schema: public
select_permissions:
- role: me
  permission:
    columns:
    - account_id
    - allow_all
    - allowed_features
    - can_create
    - can_update
    - can_delete
    filter: {}
- role: superadmin
  permission:
    columns:
    - account_id
    - allow_all
    - allowed_features
    - can_create
    - can_update
    - can_delete
    filter:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
- role: user
  permission:
    columns:
    - account_id
    - allow_all
    - allowed_features
    - can_create
    - can_update
    - can_delete
    filter: {}
