table:
  name: account_feature_permissions
  schema: public
insert_permissions:
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                disabled:
                  _eq: false
                role:
                  _in:
                    - owner
                    - admin
                user_uid:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: account_users
                schema: public
              _where:
