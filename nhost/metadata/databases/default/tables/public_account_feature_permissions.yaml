table:
  name: account_feature_permissions
  schema: public
insert_permissions:
- role: superadmin
  permission:
    check:
      _exists:
        _table:
          name: active_superadmin_identity
          schema: public
        _where:
          user_uid:
            _eq: X-Hasura-User-Id
    columns: '*'
- role: user
  permission:
    check:
      _and:
      - _exists:
          _table:
            name: account_users
            schema: public
          _where:
            account_id:
              _ceq:
              - $
              - account_id
            disabled:
              _eq: false
            role:
              _in:
              - owner
              - admin
            user_uid:
              _eq: X-Hasura-User-Id
      - _exists:
