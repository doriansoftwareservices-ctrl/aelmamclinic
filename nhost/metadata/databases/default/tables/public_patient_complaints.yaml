table:
  name: patient_complaints
  schema: public
object_relationships:
  - name: complaint_template
    using:
      foreign_key_constraint_on: complaint_id
  - name: patient
    using:
      foreign_key_constraint_on: patient_id
array_relationships:
  - name: answers
    using:
      foreign_key_constraint_on:
        column: patient_complaint_id
        table:
          name: patient_complaint_answers
          schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _and:
          
select_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _and:
          
update_permissions:
  - role: me
    permission:
      columns: '*'
      filter:
        _and:
          
delete_permissions:
  - role: me
    permission:
      filter:
        _and:
          
