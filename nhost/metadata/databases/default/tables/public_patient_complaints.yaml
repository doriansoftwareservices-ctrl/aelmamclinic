table:
  name: patient_complaints
  schema: public
object_relationships:
  - name: complaint_template
    using:
      foreign_key_constraint_on: complaint_id
  - name: patient
    using:
      foreign_key_constraint_on: patient_id
array_relationships:
  - name: answers
    using:
      foreign_key_constraint_on:
        column: patient_complaint_id
        table:
          name: patient_complaint_answers
          schema: public
insert_permissions:
  - role: me
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: employees
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                is_doctor:
                  _eq: true
                user_uid:
                  _eq: X-Hasura-User-Id
          - _exists:
              _table:
                name: account_subscriptions
                schema: public
              _where:
                account_id:
                  _ceq: account_id
                plan_code:
                  _in:
                    - month
                    - year
                status:
                  _eq: active
      columns: '*'
  - role: superadmin
    permission:
      check: {}
      columns: '*'
  - role: user
    permission:
      check:
        _and:
          - _exists:
              _table:
